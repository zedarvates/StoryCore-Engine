openapi: 3.0.0
info:
  title: StoryCore-Engine MVP API
  version: 1.0.0
  description: MVP REST API for Identity Lock, Script Segmentation, Templates, Video rendering
servers:
- url: http://localhost:8000
paths:
  /api/identity/create:
    post:
      summary: Create identity profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
  /api/identity/apply:
    post:
      summary: Apply identity to a scene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityApplyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityApplyResponse'
  /api/identity/{identity_id}/validate/{scene_id}:
    get:
      summary: Validate identity consistency
      parameters:
      - name: identity_id
        in: path
        required: true
        schema:
          type: string
      - name: scene_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityValidateResponse'
  /api/segmentation/segment:
    post:
      summary: Segment a script
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptSegmentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptSegmentResponse'
  /api/templates/create:
    post:
      summary: Create a prompt template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
  /api/templates/{template_id}/render:
    post:
      summary: Render a template
      parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRenderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateRenderResponse'
  /api/video/render:
    post:
      summary: Render a video from prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoRenderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoRenderResponse'
  /api/video/merge-export:
    post:
      summary: Merge videos and export to platforms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoMergeExportRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoMergeExportResponse'
  # ============================================================================
  # Task Queue Management API (AsyncTaskQueue Integration)
  # ============================================================================
  /api/tasks/queue/status:
    get:
      summary: Get AsyncTaskQueue status snapshot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatusResponse'
        '500':
          description: Internal Server Error
  /api/tasks/api:
    post:
      summary: Submit a generic API task to AsyncTaskQueue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APITaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIQueueResponse'
        '500':
          description: Submission failed
  /api/tasks/api/{job_id}:
    get:
      summary: Get status of an API-driven task
      security:
        - bearerAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITaskStatusResponse'
        '404':
          description: Task not found
  /api/tasks/queue:
    get:
      summary: Get all jobs in task queue sorted by priority
      security:
        - bearerAuth: []
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          type: string
      - name: status_filter
        in: query
        required: false
        schema:
          type: string
          enum: [pending, processing, completed, failed, cancelled]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskQueueResponse'
  /api/tasks/{job_id}/priority:
    put:
      summary: Update job priority (1=highest, 10=lowest)
      security:
        - bearerAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorityUpdateResponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Job not found
  /api/tasks/{job_id}/move-up:
    post:
      summary: Move job up in queue (increase priority)
      security:
        - bearerAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorityUpdateResponse'
        '400':
          description: Already at highest position
        '403':
          description: Forbidden
        '404':
          description: Job not found
  /api/tasks/{job_id}/move-down:
    post:
      summary: Move job down in queue (decrease priority)
      security:
        - bearerAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorityUpdateResponse'
        '400':
          description: Already at lowest position
        '403':
          description: Forbidden
        '404':
          description: Job not found
  /api/tasks/{job_id}/retry:
    post:
      summary: Retry a failed or cancelled job
      security:
        - bearerAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryResponse'
        '400':
          description: Only failed or cancelled jobs can be retried
        '403':
          description: Forbidden
        '404':
          description: Job not found
  /api/tasks/stats:
    get:
      summary: Get queue statistics
      security:
        - bearerAuth: []
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatsResponse'
  /api/tasks/{job_id}:
    delete:
      summary: Delete a job from the queue
      security:
        - bearerAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  job_id:
                    type: string
        '400':
          description: Cannot delete active job
        '403':
          description: Forbidden
        '404':
          description: Job not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    IdentityCreateRequest:
      type: object
      required:
        - name
        - project_id
      properties:
        name:
          type: string
        project_id:
          type: string
        reference_image:
          type: string
        manual_attributes:
          type: object
        lock_features:
          type: array
          items:
            type: string
    IdentityResponse:
      type: object
      properties:
        identity_id:
          type: string
        name:
          type: string
        project_id:
          type: string
        thumbnail_url:
          type: string
        lock_strength:
          type: number
        locked_features:
          type: array
          items:
            type: string
    IdentityApplyRequest:
      type: object
      properties:
        identity_id:
          type: string
        scene_id:
          type: string
        generation_params:
          type: object
    IdentityApplyResponse:
      type: object
      properties:
        applied:
          type: boolean
        identity_score:
          type: number
        prompt_enhanced:
          type: string
    IdentityValidateResponse:
      type: object
      properties:
        identity_id:
          type: string
        scene_id:
          type: string
        consistency_score:
          type: number
        issues:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string
    ScriptSegmentRequest:
      type: object
      properties:
        script:
          type: string
        language:
          type: string
        target_duration:
          type: number
    ScriptSegmentResponse:
      type: object
      properties:
        segmentation_id:
          type: string
        total_duration:
          type: number
        segments:
          type: array
          items:
            type: object
    TemplateCreateRequest:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        template_text:
          type: string
        variables:
          type: object
    TemplateResponse:
      type: object
      properties:
        template_id:
          type: string
        name:
          type: string
        category:
          type: string
        template_text:
          type: string
        variables:
          type: object
        created_at:
          type: string
    TemplateRenderRequest:
      type: object
      properties:
        template_id:
          type: string
        payload:
          type: object
    TemplateRenderResponse:
      type: object
      properties:
        rendered_text:
          type: string
        token_count:
          type: integer
    VideoRenderRequest:
      type: object
      properties:
        prompt:
          type: string
        identity_id:
          type: string
        resolution:
          type: string
        audio_url:
          type: string
    VideoRenderResponse:
      type: object
      properties:
        video_url:
          type: string
        duration:
          type: number
        resolution:
          type: string
    VideoMergeExportRequest:
      type: object
      properties:
        videos:
          type: array
          items:
            type: string
        platforms:
          type: array
          items:
            type: string
        generate_metadata:
          type: boolean
    VideoMergeExportResponse:
      type: object
      properties:
        final_video_url:
          type: string
        platform_versions:
          type: object
        metadata:
          type: object
    # ============================================================================
    # Task Queue Schemas (AsyncTaskQueue Integration)
    # ============================================================================
    QueueStatusResponse:
      type: object
      properties:
        queue_size:
          type: integer
          description: Number of tasks in queue
        running:
          type: integer
          description: Number of currently running tasks
        completed:
          type: integer
          description: Number of completed tasks
        waiting_for_dependencies:
          type: integer
          description: Number of tasks waiting for dependencies
        workers_active:
          type: integer
          description: Number of active worker threads
    APITaskRequest:
      type: object
      required:
        - job_id
        - payload
      properties:
        job_id:
          type: string
          description: Unique job identifier
        payload:
          type: object
          description: Task payload data
        priority:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: Priority level (1 = highest, 10 = lowest)
        timeout_seconds:
          type: integer
          minimum: 1
          default: 300
          description: Maximum execution time in seconds
    APIQueueResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether submission succeeded
        message:
          type: string
          description: Status message
    APITaskStatusResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled, timeout]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        error:
          type: string
    TaskQueueItem:
      type: object
      properties:
        job_id:
          type: string
        project_id:
          type: string
        prompt:
          type: string
        shot_count:
          type: integer
        style:
          type: string
        mood:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed, cancelled]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        current_step:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 10
        estimated_time:
          type: integer
        error:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    TaskQueueResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskQueueItem'
        total:
          type: integer
        pending:
          type: integer
        processing:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
    PriorityUpdateRequest:
      type: object
      required:
        - priority
      properties:
        priority:
          type: integer
          minimum: 1
          maximum: 10
          description: Priority level (1 = highest, 10 = lowest)
    PriorityUpdateResponse:
      type: object
      properties:
        job_id:
          type: string
        old_priority:
          type: integer
        new_priority:
          type: integer
        message:
          type: string
    RetryResponse:
      type: object
      properties:
        job_id:
          type: string
        old_status:
          type: string
        new_status:
          type: string
        message:
          type: string
    QueueStatsResponse:
      type: object
      properties:
        total_jobs:
          type: integer
        pending_jobs:
          type: integer
        processing_jobs:
          type: integer
        completed_jobs:
          type: integer
        failed_jobs:
          type: integer
        cancelled_jobs:
          type: integer
        average_wait_time:
          type: number
          description: Average wait time in seconds
        estimated_completion_time:
          type: integer
          description: Estimated completion time in seconds
        throughput_per_second:
          type: number
          description: Tasks processed per second
        avg_execution_time:
          type: number
          description: Average execution time in seconds
        circuit_breaker_status:
          type: string
          enum: [closed, open, half-open]
          description: Circuit breaker state
