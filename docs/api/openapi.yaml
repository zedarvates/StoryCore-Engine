info:
  description: Backend API for StoryCore Creative Studio Engine
  title: StoryCore-Engine API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api:
    get:
      description: API information endpoint
      operationId: api_info_api_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Api Info
  /api/addons/comic_generator/continuity/{project_id}:
    get:
      description: Liste tous les packages de continuité (chapitres extractés) d'un
        projet.
      operationId: list_continuity_api_addons_comic_generator_continuity__project_id__get
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Continuity
      tags:
      - Comic Generator
  /api/addons/comic_generator/continuity/{project_id}/chapter/{chapter_number}/next-input:
    get:
      description: 'Retourne les données d''entrée injectées pour le chapitre suivant.


        Ce payload est directement compatible avec GeneratePageRequest —

        il inclut les personnages avec leur état, le checkpoint narratif,

        les arcs ouverts et le story_context construit depuis la mémoire.'
      operationId: get_next_chapter_input_api_addons_comic_generator_continuity__project_id__chapter__chapter_number__next_input_get
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: path
        name: chapter_number
        required: true
        schema:
          title: Chapter Number
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Next Chapter Input
      tags:
      - Comic Generator
  /api/addons/comic_generator/export:
    post:
      description: Export comic to JSON or PDF.
      operationId: export_comic_api_addons_comic_generator_export_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/addons__official__comic_generator__src__main__ExportRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Export Comic
      tags:
      - Comic Generator
  /api/addons/comic_generator/extract:
    post:
      description: "Extrait la continuité narrative d'un chapitre BD terminé.\n\n\
        Produit un ChapterContinuityPackage sauvegardé dans\ndata/continuity/<project_id>/chapter_<N>.json\n\
        \nContient :\n  • Personnages avec état émotionnel/physique post-chapitre\n\
        \  • Lieux visités avec atmosphère et événements clés\n  • Objets narratifs\
        \ (acquis, perdus, symboles)\n  • Arcs ouverts / fermés\n  • Mémoire à 3 niveaux\
        \ (local / arc / global)\n  • Cliffhanger + suggestion d'accroche pour le\
        \ chapitre suivant"
      operationId: extract_narrative_api_addons_comic_generator_extract_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractNarrativeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Extract Narrative
      tags:
      - Comic Generator
  /api/addons/comic_generator/generate:
    post:
      description: Generate the next comic page for a project.
      operationId: generate_page_api_addons_comic_generator_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePageRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Generate Page
      tags:
      - Comic Generator
  /api/addons/comic_generator/history/{project_id}:
