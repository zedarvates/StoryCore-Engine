components:
  schemas:
    APIQueueResponse:
      properties:
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        success:
          title: Success
          type: boolean
      required:
      - success
      title: APIQueueResponse
      type: object
    APITaskRequest:
      properties:
        job_id:
          title: Job Id
          type: string
        payload:
          additionalProperties: true
          title: Payload
          type: object
        priority:
          default: 5
          maximum: 10.0
          minimum: 1.0
          title: Priority
          type: integer
        timeout_seconds:
          default: 300
          minimum: 1.0
          title: Timeout Seconds
          type: integer
      required:
      - job_id
      - payload
      title: APITaskRequest
      type: object
    APITaskStatusResponse:
      description: Status response for an API-driven task submitted to AsyncTaskQueue
      properties:
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Completed At
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        job_id:
          title: Job Id
          type: string
        progress:
          anyOf:
          - type: integer
          - type: 'null'
          title: Progress
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
        status:
          title: Status
          type: string
      required:
      - job_id
      - status
      title: APITaskStatusResponse
      type: object
    AddKeyframeRequest:
      description: Request to add a keyframe
      properties:
        easing:
          default: linear
          title: Easing
          type: string
        interpolation:
          default: linear
          title: Interpolation
          type: string
        property_name:
          title: Property Name
          type: string
        time:
          title: Time
          type: number
        value:
          title: Value
      required:
      - property_name
      - time
      - value
      title: AddKeyframeRequest
      type: object
    AdjustSegmentRequest:
      description: Requête d'ajustement de segment
      example:
        action: split
        split_at: 50
      properties:
        action:
          description: 'Action à effectuer: split, merge, edit'
          title: Action
          type: string
        split_at:
          anyOf:
          - type: integer
          - type: 'null'
          description: Position de coupure pour split
          title: Split At
        text:
          anyOf:
          - type: string
          - type: 'null'
          description: Nouveau texte pour edit
          title: Text
      required:
      - action
      title: AdjustSegmentRequest
      type: object
    AgentKeyResponse:
      properties:
        agent_name:
          title: Agent Name
          type: string
        agent_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Version
        created_at:
          title: Created At
          type: string
        duplicate_ratio:
          title: Duplicate Ratio
          type: number
        framework:
          anyOf:
          - type: string
          - type: 'null'
          title: Framework
        full_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Full Key
        id:
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        is_flagged:
          title: Is Flagged
          type: boolean
        key_prefix:
          title: Key Prefix
          type: string
        last_used_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Used At
        rate_limit_per_hour:
          title: Rate Limit Per Hour
          type: integer
        total_gems_earned:
          title: Total Gems Earned
          type: integer
        total_reports_submitted:
          title: Total Reports Submitted
          type: integer
      required:
      - id
      - agent_name
      - key_prefix
      - full_key
      - framework
      - agent_version
      - is_active
      - is_flagged
      - total_reports_submitted
      - total_gems_earned
      - duplicate_ratio
      - rate_limit_per_hour
      - created_at
      - last_used_at
      title: AgentKeyResponse
      type: object
    AnamorphicFlareRequest:
      description: Request for anamorphic flare
      properties:
        horizontal_stretch:
          default: 2.35
          title: Horizontal Stretch
          type: number
        input_path:
          title: Input Path
          type: string
        intensity:
          default: 0.5
          title: Intensity
          type: number
        output_path:
          title: Output Path
          type: string
      required:
      - input_path
      - output_path
      title: AnamorphicFlareRequest
      type: object
    AnimationPresetResponse:
      description: Response for a single animation preset
      properties:
        category:
          title: Category
          type: string
        default_duration:
          title: Default Duration
          type: number
        description:
          title: Description
          type: string
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
      required:
      - id
      - name
      - category
      - description
      - default_duration
      title: AnimationPresetResponse
      type: object
    ApplyAnimationRequest:
      description: Request to apply animation preset
      properties:
        duration:
          default: 3.0
          title: Duration
          type: number
        easing:
          default: ease_in_out
          title: Easing
          type: string
        fps:
          default: 30
          title: Fps
          type: integer
        input_path:
          title: Input Path
          type: string
        intensity:
          default: 1.0
          title: Intensity
          type: number
        output_path:
          title: Output Path
          type: string
        preset:
          default: ken_burns
          title: Preset
          type: string
      required:
      - input_path
      - output_path
      title: ApplyAnimationRequest
      type: object
    ApplyAnimationResponse:
      description: Response for animation application
      properties:
        message:
          title: Message
          type: string
        output_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Path
        success:
          title: Success
          type: boolean
      required:
      - success
      - message
      title: ApplyAnimationResponse
      type: object
    ApplyIdentityRequest:
      description: Requête d'application d'identité à un prompt
      properties:
        scene_description:
          description: Description de la scène
          title: Scene Description
          type: string
        scene_type:
          default: default
          description: 'Type de scène: default, close_up, medium_shot, full_body,
            action, emotional, outdoor, indoor, night'
          title: Scene Type
          type: string
      required:
      - scene_description
      title: ApplyIdentityRequest
      type: object
    ApplyIdentityResponse:
      description: Réponse pour l'application d'identité
      properties:
        identity_id:
          title: Identity Id
          type: string
        identity_name:
          title: Identity Name
          type: string
        prompt:
          title: Prompt
          type: string
      required:
      - prompt
      - identity_id
      - identity_name
      title: ApplyIdentityResponse
      type: object
    ArcAnalysisRequest:
      description: Request to analyze character arc
      properties:
        character_id:
          title: Character Id
          type: string
      required:
      - character_id
      title: ArcAnalysisRequest
      type: object
    AudioFormat:
      description: Audio format enumeration
      enum:
      - mp3
      - wav
      - ogg
      - flac
      title: AudioFormat
      type: string
    AudioGenerationJobResponse:
      description: Response model for audio generation job
      properties:
        estimated_time_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Estimated Time Seconds
        job_id:
          title: Job Id
          type: string
        progress:
          title: Progress
          type: integer
        status:
          title: Status
          type: string
      required:
      - job_id
      - status
      - progress
      - estimated_time_seconds
      title: AudioGenerationJobResponse
      type: object
    AudioGenerationRequest:
      description: Request model for audio generation
      properties:
        audio_type:
          $ref: '#/components/schemas/AudioType'
          default: voice
        duration_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration Seconds
        format:
          $ref: '#/components/schemas/AudioFormat'
          default: mp3
        project_id:
          minLength: 1
          title: Project Id
          type: string
        settings:
          additionalProperties: true
          default: {}
          title: Settings
          type: object
        text:
          minLength: 1
          title: Text
          type: string
        voice:
          anyOf:
          - $ref: '#/components/schemas/TTSVoice'
          - type: 'null'
      required:
      - project_id
      - text
      title: AudioGenerationRequest
      type: object
    AudioMixRequest:
      description: Request model for audio mixing
      properties:
        output_duration_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Output Duration Seconds
        output_format:
          $ref: '#/components/schemas/AudioFormat'
          default: mp3
        project_id:
          minLength: 1
          title: Project Id
          type: string
        tracks:
          items:
            $ref: '#/components/schemas/AudioTrack'
          title: Tracks
          type: array
      required:
      - project_id
      - tracks
      title: AudioMixRequest
      type: object
    AudioResponse:
      description: Response model for audio data
      properties:
        channels:
          title: Channels
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        duration_seconds:
          title: Duration Seconds
          type: number
        file_size_bytes:
          title: File Size Bytes
          type: integer
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
        format:
          $ref: '#/components/schemas/AudioFormat'
        id:
          title: Id
          type: string
        project_id:
          title: Project Id
          type: string
        sample_rate:
          title: Sample Rate
          type: integer
        status:
          title: Status
          type: string
        type:
          $ref: '#/components/schemas/AudioType'
      required:
      - id
      - project_id
      - type
      - format
      - duration_seconds
      - file_size_bytes
      - file_url
      - sample_rate
      - channels
      - status
      - created_at
      title: AudioResponse
      type: object
    AudioSyncRequest:
      description: Request model for audio-video sync
      properties:
        audio_id:
          title: Audio Id
          type: string
        offset_seconds:
          default: 0.0
          title: Offset Seconds
          type: number
        project_id:
          minLength: 1
          title: Project Id
          type: string
        video_id:
          title: Video Id
          type: string
      required:
      - project_id
      - audio_id
      - video_id
      title: AudioSyncRequest
      type: object
    AudioTrack:
      description: Audio track model for mixing
      properties:
        fade_in_seconds:
          default: 0.0
          minimum: 0.0
          title: Fade In Seconds
          type: number
        fade_out_seconds:
          default: 0.0
          minimum: 0.0
          title: Fade Out Seconds
          type: number
        id:
          title: Id
          type: string
        start_time_seconds:
          default: 0.0
          minimum: 0.0
          title: Start Time Seconds
          type: number
        type:
          $ref: '#/components/schemas/AudioType'
        volume:
          default: 1.0
          maximum: 2.0
          minimum: 0.0
          title: Volume
          type: number
      required:
      - id
      - type
      title: AudioTrack
      type: object
    AudioType:
      description: Audio type enumeration
      enum:
      - music
      - sfx
      - voice
      - ambient
      - mix
      title: AudioType
      type: string
    AutoDuckingRequest:
      description: Auto-ducking request.
      properties:
        music_id:
          title: Music Id
          type: string
        speech_id:
          title: Speech Id
          type: string
      required:
      - music_id
      - speech_id
      title: AutoDuckingRequest
      type: object
    AutoDuckingResponse:
      description: Response for auto-ducking
      properties:
        message:
          title: Message
          type: string
        output_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Path
        success:
          title: Success
          type: boolean
      required:
      - success
      - message
      title: AutoDuckingResponse
      type: object
    AutoMixRequest:
      description: Request model for auto-mix
      properties:
        auto_mix_enabled:
          default: true
          title: Auto Mix Enabled
          type: boolean
        ducking_enabled:
          default: true
          title: Ducking Enabled
          type: boolean
        project_id:
          minLength: 1
          title: Project Id
          type: string
        track_ids:
          items:
            type: string
          title: Track Ids
          type: array
      required:
      - project_id
      - track_ids
      title: AutoMixRequest
      type: object
    AutoMixResponse:
      description: Response model for auto-mix
      properties:
        configuration:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Configuration
        errors:
          items:
            type: string
          title: Errors
          type: array
        success:
          title: Success
          type: boolean
        warnings:
          items:
            type: string
          title: Warnings
          type: array
      required:
      - success
      title: AutoMixResponse
      type: object
    AutoTrimRequest:
      description: Auto trim silence request.
      properties:
        media_id:
          title: Media Id
          type: string
        min_duration:
          default: 0.5
          title: Min Duration
          type: number
        threshold:
          default: -30.0
          title: Threshold
          type: number
      required:
      - media_id
      title: AutoTrimRequest
      type: object
    AutoTrimResponse:
      description: Auto trim silence response.
      properties:
        job_id:
          title: Job Id
          type: string
        output_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Path
        status:
          title: Status
          type: string
      required:
      - job_id
      - status
      - output_path
      title: AutoTrimResponse
      type: object
    AvailableOptionsResponse:
      description: Response model for available options
      properties:
        expressions:
          items:
            additionalProperties:
              type: string
            type: object
          title: Expressions
          type: array
        lighting:
          items:
            additionalProperties:
              type: string
            type: object
          title: Lighting
          type: array
        poses:
          items:
            additionalProperties:
              type: string
            type: object
          title: Poses
          type: array
        styles:
          items:
            additionalProperties:
              type: string
            type: object
          title: Styles
          type: array
      required:
      - styles
      - expressions
      - poses
      - lighting
      title: AvailableOptionsResponse
      type: object
    BackgroundReplaceRequest:
      description: Request for background replacement
      properties:
        blend_edges:
          default: 10
          title: Blend Edges
          type: integer
        color_match:
          default: true
          title: Color Match
          type: boolean
        input_path:
          title: Input Path
          type: string
        lighting_match:
          default: true
          title: Lighting Match
          type: boolean
        mask_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Mask Path
        new_background:
          title: New Background
          type: string
        output_path:
          title: Output Path
          type: string
      required:
      - input_path
      - output_path
      - new_background
      title: BackgroundReplaceRequest
      type: object
    BackgroundReplaceResponse:
      description: Response for background replacement
      properties:
        message:
          title: Message
          type: string
        output_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Path
        success:
          title: Success
          type: boolean
      required:
      - success
      - message
      title: BackgroundReplaceResponse
      type: object
    BatchExtractRequest:
      description: Requête pour l'extraction batch depuis plusieurs images
      properties:
        image_paths:
          description: Liste des chemins d'images
          items:
            type: string
          title: Image Paths
          type: array
        merge_results:
          default: true
          description: Fusionner les résultats
          title: Merge Results
          type: boolean
      required:
      - image_paths
      title: BatchExtractRequest
      type: object
    BatchProcessRequest:
      description: Request for batch processing
      properties:
        items:
          items:
            additionalProperties: true
            type: object
          title: Items
          type: array
        job_type:
          title: Job Type
          type: string
        max_workers:
          default: 4
          title: Max Workers
          type: integer
      required:
      - items
      - job_type
      title: BatchProcessRequest
      type: object
    BeatAlignedCutsRequest:
      description: Request for beat-aligned cuts
      properties:
        beat_times:
          items:
            type: number
          title: Beat Times
          type: array
        target_durations:
          items:
            type: number
          title: Target Durations
          type: array
        tolerance:
          default: 0.2
          title: Tolerance
          type: number
      required:
      - beat_times
      - target_durations
      title: BeatAlignedCutsRequest
      type: object
    BeatAlignedCutsResponse:
      description: Response for beat-aligned cuts
      properties:
        cuts:
          items:
            maxItems: 2
            minItems: 2
            prefixItems:
            - type: number
            - type: number
            type: array
          title: Cuts
          type: array
        total_cuts:
          title: Total Cuts
          type: integer
      required:
      - cuts
      - total_cuts
      title: BeatAlignedCutsResponse
      type: object
    BeatDetectionRequest:
      description: Request for beat detection
      properties:
        audio_path:
          title: Audio Path
          type: string
        method:
          default: librosa
          title: Method
          type: string
      required:
      - audio_path
      title: BeatDetectionRequest
      type: object
    BeatDetectionResponse:
      description: Beat detection response.
      properties:
        beats:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Beats
        job_id:
          title: Job Id
          type: string
        status:
          title: Status
          type: string
      required:
      - job_id
      - status
      - beats
      title: BeatDetectionResponse
      type: object
    BeatInfoResponse:
      description: Single beat information
      properties:
        beat_type:
          title: Beat Type
          type: string
        confidence:
          title: Confidence
          type: number
        tempo:
          title: Tempo
          type: number
        timestamp:
          title: Timestamp
          type: number
      required:
      - timestamp
      - confidence
      - beat_type
      - tempo
      title: BeatInfoResponse
      type: object
    BloomEffectRequest:
      description: Request for bloom effect
      properties:
        input_path:
          title: Input Path
          type: string
        intensity:
          default: moderate
          title: Intensity
          type: string
        output_path:
          title: Output Path
          type: string
        radius:
          default: 20
          title: Radius
          type: integer
        strength:
          default: 0.5
          title: Strength
          type: number
        threshold:
          default: 0.7
          title: Threshold
          type: number
      required:
      - input_path
      - output_path
      title: BloomEffectRequest
      type: object
    BloomEffectResponse:
      description: Response for bloom effect
      properties:
        message:
          title: Message
          type: string
        output_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Path
        success:
          title: Success
          type: boolean
      required:
      - success
      - message
      title: BloomEffectResponse
      type: object
    Body_analyze_image_for_character_api_character_analyze_image_post:
