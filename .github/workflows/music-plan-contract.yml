name: MusicPlan Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "schemas/music-plan-v1.schema.json"
      - "src/music_plan.py"
      - "src/music_provider.py"
      - "scripts/music_plan_mutation_probe.py"
      - "scripts/music_plan_holdout_evaluator.py"
      - "tests/test_music_plan.py"
      - "tests/fixtures/music_plan/**"
      - "docs/music-planning-layer-v1.md"
      - ".github/workflows/music-plan-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused validation dependencies
        run: python -m pip install 'pytest>=8,<10' 'jsonschema>=4.23,<5'
      - name: Compile model-free contracts
        run: python -m py_compile src/music_plan.py src/music_provider.py scripts/music_plan_mutation_probe.py scripts/music_plan_holdout_evaluator.py
      - name: Run MusicPlan contract tests
        run: python -m pytest -q tests/test_music_plan.py
      - name: Run controlled negative mutation probe
        run: python -m scripts.music_plan_mutation_probe
      - name: Verify private holdout evaluator protocol
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          plan = json.loads(Path('tests/fixtures/music_plan/full.json').read_text(encoding='utf-8'))
          request = {"id": "public-protocol-smoke", "input": {"plan": plan, "expected_valid": True}}
          r = subprocess.run(
              [sys.executable, '-m', 'scripts.music_plan_holdout_evaluator'],
              input=json.dumps(request), text=True, capture_output=True, check=True,
          )
          response = json.loads(r.stdout)
          assert response == {"passed": True}, response
          print('holdout evaluator protocol OK')
          PY
      - name: Verify Draft 2020-12 schema and reference fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path('schemas/music-plan-v1.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          for path in sorted(Path('tests/fixtures/music_plan').glob('*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              validator.validate(data)
              print(f'OK {path}')
          PY
