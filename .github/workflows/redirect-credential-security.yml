name: Redirect Credential Security

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "config/package.json"
      - "config/package-lock.json"
      - "creative-studio-ui/package.json"
      - "creative-studio-ui/package-lock.json"
      - "tests/security/follow-redirects.test.cjs"
      - ".github/workflows/redirect-credential-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redirect-security:
    name: Redirect credentials (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        project: [".", "config", "creative-studio-ui"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install only the locked redirect dependency
        shell: bash
        env:
          PROJECT_DIR: ${{ matrix.project }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./" + process.env.PROJECT_DIR + "/package-lock.json").packages["node_modules/follow-redirects"].version')"
          npm install --prefix "${RUNNER_TEMP}/redirect-regression" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "follow-redirects@${version}"
      - name: Check locked versions and exercise redirect boundaries
        env:
          FOLLOW_REDIRECTS_MODULE: ${{ runner.temp }}/redirect-regression/node_modules/follow-redirects
        run: node --test tests/security/follow-redirects.test.cjs
