name: Semantic Prevalidator Proof

on:
  push:
    branches: [codex/semantic-video-prevalidator]
    paths:
      - '.github/workflows/semantic-prevalidator-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Materialize only targeted files from exact commit
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p src/video_validation tests
          base="https://raw.githubusercontent.com/${REPOSITORY}/${SHA}"
          curl --fail --location --silent --show-error "$base/src/video_validation/__init__.py" -o src/video_validation/__init__.py
          curl --fail --location --silent --show-error "$base/src/video_validation/semantic_prevalidator.py" -o src/video_validation/semantic_prevalidator.py
          curl --fail --location --silent --show-error "$base/tests/test_semantic_prevalidator.py" -o tests/test_semantic_prevalidator.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile targeted module
        run: python -m compileall -q src/video_validation tests/test_semantic_prevalidator.py
      - name: Run targeted semantic gate
        run: python -m pytest -q tests/test_semantic_prevalidator.py
