name: Semantic Prevalidator Proof

on:
  push:
    branches: [codex/semantic-video-prevalidator]
    paths:
      - '.github/workflows/semantic-prevalidator-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Materialize exact commit without git submodule cleanup
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://codeload.github.com/${REPOSITORY}/tar.gz/${SHA}" \
            | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile targeted module
        run: python -m compileall -q src/video_validation tests/test_semantic_prevalidator.py
      - name: Run targeted semantic gate
        run: python -m pytest -q tests/test_semantic_prevalidator.py
