name: Studio Renderer Recovery CI

on:
  pull_request:
    paths:
      - 'creative-studio-ui/**'
      - 'electron/electronAPI.d.ts'
      - '.github/workflows/studio-renderer-recovery-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24.19.0']
    defaults:
      run:
        working-directory: creative-studio-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: creative-studio-ui/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Check shared UI library exports (not the full application)
        run: node scripts/check-ui-library-imports.mjs
      - name: Check renderer, editor control and grid type contracts (not the full application)
        run: |
          ./node_modules/.bin/tsc --project tsconfig.renderer-contract.json --pretty false
          ./node_modules/.bin/tsc --project tsconfig.preload-renderer-contract.json --pretty false
          ./node_modules/.bin/tsc --project tsconfig.editor-controls-contract.json --pretty false
          ./node_modules/.bin/tsc --project tsconfig.grid-renderer-contract.json --pretty false
      - name: Lint repaired grid renderers and their contracts
        run: ./node_modules/.bin/eslint src/components/gridEditor/GridRenderer.tsx src/components/gridEditor/PanelRenderer.tsx src/components/gridEditor/__tests__/rendererContracts.test.tsx tests/contracts/grid-renderer.contract.ts
      - name: Check shared controls, grid and editor interactions, scheduling and runtime boundaries
        run: npm test -- src/sequence-editor/store/hooks/__tests__/useEditorControls.test.tsx src/services/__tests__/AddonManager.availability.test.ts src/stores/__tests__/storeDebuggerBoundary.test.ts src/components/__tests__/editorBindings.test.tsx src/utils/__tests__/debounce.test.ts src/components/gridEditor/__tests__/rendererContracts.test.tsx src/components/gridEditor/__tests__/PanelRenderer.test.tsx
      - run: npm run build
      - name: Install browser for bounded startup check
        if: matrix.node == '24.19.0'
        run: ./node_modules/.bin/playwright install --with-deps chromium --only-shell
      - name: Open the production bundle without live providers
        if: matrix.node == '24.19.0'
        run: ./node_modules/.bin/playwright test --config playwright.bundle-smoke.config.ts
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.node == '24.19.0'
        with:
          name: studio-bundle-startup-failure
          path: creative-studio-ui/studio-bundle-test-results/
          if-no-files-found: ignore

  full-types:
    name: Full application types (unfinished)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: creative-studio-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: creative-studio-ui/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Check the complete existing TypeScript build
        shell: bash
        run: ./node_modules/.bin/tsc -b --pretty false 2>&1 | tee studio-typecheck-diagnostics.log
      - name: Summarize full compiler status
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = Path('studio-typecheck-diagnostics.log')
          if log.exists():
              count = len(re.findall(r'error TS\d+:', log.read_text()))
              status = f'Full application compiler: {count} diagnostic(s). See the compiler step conclusion and artifact; focused contracts do not replace this check.'
          else:
              status = 'Full application compiler unavailable: installation or setup did not complete.'
          print(status)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(status + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: studio-full-types-diagnostics
          path: creative-studio-ui/studio-typecheck-diagnostics.log
          if-no-files-found: ignore
