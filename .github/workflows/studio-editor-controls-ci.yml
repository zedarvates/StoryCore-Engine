name: Studio Editor Controls CI

on:
  pull_request:
    paths:
      - 'creative-studio-ui/src/sequence-editor/**'
      - 'creative-studio-ui/src/AppProviders.tsx'
      - 'creative-studio-ui/package.json'
      - 'creative-studio-ui/package-lock.json'
      - 'creative-studio-ui/vitest*'
      - '.github/workflows/studio-editor-controls-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24.19.0']
    defaults:
      run:
        working-directory: creative-studio-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: creative-studio-ui/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - run: npm test -- src/sequence-editor/store/hooks/__tests__/useEditorControls.test.tsx
