worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Load Balancing for Backend
    upstream backend_servers {
        server backend:8080;
        # For multiple instances, add more if using Swarm/K8s/Compose with replicas
        keepalive 32;
    }

    server {
        listen 80;
        server_name storycore.io www.storycore.io;

        # Static Frontend (if serving from Nginx)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # API Proxy
        location /api {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running AI tasks
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Monitoring Metrics
        location /metrics {
            proxy_pass http://backend_servers/metrics;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12; # Allow internal network
            deny all;
        }

        # Health Check
        location /health {
            proxy_pass http://backend_servers/health;
            access_log off;
        }
    }
}
