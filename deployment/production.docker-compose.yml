version: '3.8'

services:
  # ========================================
  # Nginx Reverse Proxy & Load Balancer
  # ========================================
  proxy:
    image: nginx:alpine
    container_name: storycore-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../creative-studio-ui/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - storycore-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # Backend API (Multiple Replicas)
  # ========================================
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 4G
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://storycore:password@postgres:5432/storycore
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - WORKERS=4 # Each replica has workers
    env_file:
      - ../.env.production
    volumes:
      - storycore_data:/app/data
      - storycore_generated:/app/generated
      - storycore_logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - storycore-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # AI Services with GPU Support
  # ========================================
  llm-service:
    image: ollama/ollama:latest
    container_name: storycore-llm-prod
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./models/ollama:/root/.ollama
    networks:
      - storycore-internal
    restart: unless-stopped

  comfyui:
    image: comfyanonymous/comfyui:latest
    container_name: storycore-comfyui-prod
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./models/comfy-models:/ComfyUI/models
      - ./comfy-outputs:/ComfyUI/output
    networks:
      - storycore-internal
    restart: unless-stopped

  # ========================================
  # Shared Storage & Infrastructure
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: storycore-db-prod
    environment:
      - POSTGRES_USER=storycore
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=storycore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - storycore-internal
    restart: unless-stopped
    command: postgres -c 'max_connections=200' -c 'shared_buffers=2GB'

  redis:
    image: redis:7-alpine
    container_name: storycore-cache-prod
    command: redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - storycore-internal
    restart: unless-stopped

networks:
  storycore-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storycore_data:
  storycore_generated:
  storycore_logs:
